<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Steven Homelessness Project</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@^6.7.0/dist/maplibre-gl.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
    }

    #map {
      width: 100%;
      height: 600px;
    }
  </style>
</head>

<body>

<h1>Homelessness and Shelter Access in Santa Clara County</h1>

<div id="map"></div>

<script type="module">

  import * as maplibregl from
    'https://unpkg.com/maplibre-gl@^6.7.0/dist/maplibre-gl.mjs';

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: [-121.90, 37.30],
    zoom: 9
  });

  map.addControl(new maplibregl.NavigationControl());

</script>

</body>
</html>
